name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r skills/container-lifecycle-management/scripts/requirements.txt
      - run: python -B -m unittest discover -s tests -v

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r skills/container-lifecycle-management/scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/container-lifecycle-management/scripts/maintenance.py --policy examples/services.yaml validate
      - run: python skills/container-lifecycle-management/scripts/maintenance.py --policy examples/services.yaml plan
      - run: python skills/container-lifecycle-management/scripts/maintenance.py --policy examples/native-policy.yaml validate
      - run: python skills/container-lifecycle-management/scripts/maintenance.py --policy examples/native-policy.yaml plan
      - run: python skills/container-lifecycle-management/scripts/maintenance.py --policy examples/project-managed.yaml validate
      - run: python skills/container-lifecycle-management/scripts/maintenance.py --policy examples/repository-managed.yaml validate
      - run: python skills/container-lifecycle-management/scripts/compose_preflight.py --file compose.yaml --project-directory tests/fixtures/rebuild_preflight --render --check-build-sources --format json
